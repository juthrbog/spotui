name: Security

on:
  push:
    branches: [main]
  pull_request:
  # New advisories appear while the code stays the same. Scan main every
  # Monday, off the hour, because GitHub delays runs at the start of the hour.
  # GitHub sends a failed scheduled run to the user who last changed the cron.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to a commit SHA. Dependabot updates the SHA and the
# version comment.
jobs:
  golangci-lint:
    name: Lint & SAST
    # The weekly run looks for new advisories. This job uses no advisory data.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      # go-librespot needs these C libraries to type-check and build.
      - name: Install audio libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libogg-dev libvorbis-dev libflac-dev libmpg123-dev

      # golangci-lint with gosec enabled for Go-specific security patterns
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Dependabot does not update this input. Keep it equal to
          # GOLANGCI_LINT_VERSION in Taskfile.yml.
          version: v2.14.0

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod sets the minimum Go version. Scan with the latest patch of
          # that minor version, so standard library fixes apply.
          go-version: "1.27.x"
          check-latest: true

      # go-librespot needs these C libraries to load the packages.
      - name: Install audio libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libogg-dev libvorbis-dev libflac-dev libmpg123-dev

      # Official Go vulnerability scanner with call-graph analysis. go.mod
      # pins it as a tool, and a rule in dependabot.yml keeps it up to date.
      - name: Run govulncheck
        run: go tool govulncheck ./...

  trivy:
    name: Trivy (SCA + Secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Trivy filesystem scan — pinned to SHA due to March 2026 supply chain attack
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-results.sarif

  gitleaks:
    name: Secret Detection
    # The weekly run looks for new advisories. This job uses no advisory data.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Gitleaks scans for leaked secrets in git history
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
