name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA. Dependabot updates the SHA and
      # the version comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod sets the minimum Go version. Build and test with the latest
          # patch of that minor version, so standard library fixes apply.
          go-version: "1.27.x"
          check-latest: true

      # go-librespot decodes and plays audio through these C libraries.
      - name: Install audio libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libogg-dev libvorbis-dev libflac-dev libmpg123-dev

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The same test run as the release workflow. The race detector finds
      # data races between Update and command goroutines, and a random test
      # order finds tests that depend on global state.
      - name: Test
        run: go test -race -shuffle=on -coverprofile=cover.out ./...

      - name: Coverage
        run: go tool cover -func=cover.out | tail -1
