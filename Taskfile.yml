version: "3"

vars:
  BINARY: spotui

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ─── Build ──────────────────────────────────────────────

  build:
    desc: Build the binary
    cmds:
      - go build -o {{.BINARY}} .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - "{{.BINARY}}"

  run:
    desc: Build and run spotui
    deps: [build]
    cmds:
      - ./{{.BINARY}} {{.CLI_ARGS}}

  # ─── Testing ────────────────────────────────────────────

  test:
    desc: Run all tests
    cmds:
      - go test ./... -v

  # ─── Linting ────────────────────────────────────────────

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run ./...

  vuln:
    desc: Check for known vulnerabilities
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  fmt:
    desc: Format code
    cmds:
      - gofmt -s -w .

  # ─── Housekeeping ───────────────────────────────────────

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}}
      - rm -rf .task/ dist/
      # The Go module cache of release:build has read-only files.
      - chmod -R u+w .gocache 2>/dev/null || true
      - rm -rf .gocache/

  deps:
    desc: Download and tidy dependencies
    cmds:
      - go mod download
      - go mod tidy

  # ─── Release ────────────────────────────────────────────

  release:build:
    desc: "Build a portable Linux binary in Docker (usage: task release:build -- amd64)"
    cmds:
      - build/build.sh {{.CLI_ARGS}}

  release:
    desc: "Tag and push a new release (usage: task release -- v0.1.0)"
    preconditions:
      - sh: '[[ "{{.CLI_ARGS}}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
        msg: "Give a version such as v0.1.0: task release -- v0.1.0"
      - sh: test "$(git branch --show-current)" = main
        msg: "Switch to the main branch first."
      - sh: test -z "$(git status --porcelain)"
        msg: "Commit or stash your changes first."
    cmds:
      - git tag {{.CLI_ARGS}}
      - git push origin {{.CLI_ARGS}}
